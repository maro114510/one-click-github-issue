name: Release Please

# Started by hand with `pnpm release`: each run tags and publishes a merged
# release PR, or opens or updates the release PR.
on:
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    # A run from another branch would use that branch's copy of this workflow.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Labels on the release PR go through the issues API.
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  # Runs here, not on the tag: a tag pushed with GITHUB_TOKEN triggers no workflow.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - name: Check the tag matches package.json and manifest.json
        run: node scripts/check-version.mjs "$TAG"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Zip dist with the license
        run: |
          cp LICENSE dist/
          (cd dist && zip -r ../one-click-github-issue.zip .)
      # A fixed asset name keeps releases/latest/download/one-click-github-issue.zip stable.
      # release-please leaves a draft: an immutable release takes no assets once published.
      - name: Attach the zip and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" one-click-github-issue.zip --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
